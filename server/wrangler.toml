name = "logmanager-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "logmanager"
database_id = "REPLACE_AFTER_wrangler_d1_create"

[vars]
# Set this to your worker URL after the first deploy, then deploy again.
# Format: https://logmanager-server.<your-subdomain>.workers.dev
SERVER_BASE_URL = "https://logmanager-server.YOUR_SUBDOMAIN.workers.dev"

# Secrets — set with wrangler CLI, never put values here:
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put JWT_SECRET
