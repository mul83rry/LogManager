<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ردیاب زمان</title>
    <link rel="stylesheet" href="../ui/common.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row between">
      <h1 data-i18n="appName">ردیاب زمان</h1>
      <div class="row">
        <span id="week-label" class="tag mono"></span>
        <button id="open-dashboard" class="icon ghost" data-i18n-title="openDashboard" title="باز کردن داشبورد">⊞</button>
        <button id="open-options" class="icon ghost" data-i18n-title="settingsBtn" title="تنظیمات">⚙</button>
      </div>
    </header>

    <section id="active" class="card"></section>

    <section class="card">
      <div id="task-list"></div>
      <div class="add-task-row row">
        <input type="text" id="new-task-input" class="grow"
               data-i18n-ph="newTaskPlaceholder" placeholder="نام تسک جدید…" />
        <button id="add-task" class="primary" data-i18n="addTask">+ تسک</button>
      </div>
    </section>

    <p id="error" class="error" hidden></p>
    <p class="muted" id="device-line"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
