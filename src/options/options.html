<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تنظیمات</title>
    <link rel="stylesheet" href="../ui/common.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="settingsTitle">تنظیمات</h1>

      <!-- پروژه‌ها -->
      <section class="card">
        <h2 data-i18n="projectsSection">پروژه‌ها</h2>
        <div id="project-list"></div>
        <div class="row" style="margin-top:0.5rem;gap:0.4rem">
          <input type="text" id="proj-name" class="grow"
                 data-i18n-ph="projectNamePlaceholder" placeholder="نام پروژه..." />
          <input type="color" id="proj-color" class="color-input" value="#3b82f6" />
          <button id="add-proj" class="primary" data-i18n="addProjectBtn">+ پروژه</button>
        </div>
      </section>

      <!-- زبان -->
      <section class="card">
        <h2 data-i18n="langSection">زبان</h2>
        <label class="field">
          <span data-i18n="langLabel">زبان رابط کاربری</span>
          <select id="lang-select">
            <option value="fa" data-i18n="langFa">فارسی</option>
            <option value="en" data-i18n="langEn">English</option>
          </select>
        </label>
      </section>

      <!-- دستگاه -->
      <section class="card">
        <h2 data-i18n="deviceSection">دستگاه</h2>
        <div class="row">
          <span class="muted" data-i18n="deviceIdLabel">شناسه</span>
          <span id="device-id" class="mono"></span>
        </div>
        <label class="field">
          <span data-i18n="deviceLabelLabel">نام دلخواه دستگاه</span>
          <div class="row">
            <input type="text" id="device-label" class="grow"
                   data-i18n-ph="deviceLabelPlaceholder" placeholder="Laptop-Ali" />
            <button id="save-label" class="primary" data-i18n="saveLabelBtn">ذخیره</button>
          </div>
        </label>
        <p class="muted">
          <span data-i18n="filePreviewLabel">نام فایل هفته جاری</span>:
          <span id="file-preview" class="mono"></span>
        </p>
      </section>

      <!-- کلاد -->
      <section class="card">
        <h2 data-i18n="cloudSection">اتصال به کلاد</h2>
        <label class="field">
          <span data-i18n="providerLabel">محل ذخیره‌سازی</span>
          <select id="provider">
            <option value="local"    data-i18n="providerLocal">محلی (بدون نیاز به تنظیم)</option>
            <option value="server"   data-i18n="providerServer">سرور اختصاصی (Google)</option>
            <option value="onedrive" data-i18n="providerOneDrive">OneDrive</option>
          </select>
        </label>

        <!-- server config -->
        <div id="server-config" hidden>
          <label class="field">
            <span data-i18n="serverUrlLabel">آدرس سرور</span>
            <input type="url" id="server-url" class="grow"
                   data-i18n-ph="serverUrlPlaceholder" placeholder="https://..." />
          </label>
          <p class="muted" style="font-size:0.8rem">
            <span data-i18n="redirectUriLabel">Redirect URI</span>
            <code id="redirect-uri" class="mono"></code>
          </p>
        </div>

        <!-- onedrive config -->
        <div id="onedrive-config" hidden>
          <label class="field">
            <span data-i18n="clientIdLabel">شناسه کلاینت (Client ID)</span>
            <input type="text" id="client-id" class="grow"
                   placeholder="00000000-0000-0000-0000-000000000000" />
          </label>
          <p class="muted">
            <span data-i18n="redirectUriLabel">Redirect URI</span>
            <code id="redirect-uri-od" class="mono"></code>
          </p>
        </div>

        <div class="row">
          <button id="save-provider" class="primary" data-i18n="saveProviderBtn">ذخیره تنظیمات</button>
          <button id="connect" class="success" hidden></button>
          <button id="disconnect" class="danger" hidden data-i18n="disconnectBtn">قطع اتصال</button>
          <span id="cloud-status" class="tag"></span>
        </div>
      </section>

      <p id="message" class="muted" role="status"></p>
      <p id="error" class="error" hidden></p>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
