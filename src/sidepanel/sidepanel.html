<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>داشبورد ردیاب زمان</title>
    <link rel="stylesheet" href="../ui/common.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="row between">
      <h1>داشبورد</h1>
      <button id="open-options" class="ghost">تنظیمات</button>
    </header>

    <section class="card">
      <h2>فیلتر تاریخ</h2>
      <div class="row presets">
        <button data-preset="this-week" class="primary">این هفته</button>
        <button data-preset="last-week" class="ghost">هفته گذشته</button>
        <button data-preset="last-30" class="ghost">۳۰ روز اخیر</button>
      </div>
      <div class="row custom">
        <label class="grow">از
          <input type="date" id="from-date" />
        </label>
        <label class="grow">تا
          <input type="date" id="to-date" />
        </label>
        <button id="apply-range" class="primary">اعمال</button>
      </div>
      <p class="muted" id="range-summary"></p>
    </section>

    <section class="card">
      <div class="row between">
        <h2>گزارش</h2>
        <span id="grand-total" class="tag mono"></span>
      </div>
      <div id="report"></div>
    </section>

    <section class="card">
      <div class="row between">
        <h2>خروجی متنی</h2>
        <div class="row">
          <button id="copy-text" class="ghost">کپی</button>
          <button id="download-text" class="ghost">دانلود</button>
        </div>
      </div>
      <textarea id="export-text" rows="8" readonly></textarea>
    </section>

    <p id="error" class="error" hidden></p>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
