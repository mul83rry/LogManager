<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ردیاب زمان</title>
    <link rel="stylesheet" href="../ui/common.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="row between">
      <h1 data-i18n="appName">ردیاب زمان</h1>
      <div class="header-actions">
        <button id="open-window" class="icon ghost" data-i18n-title="openWindowBtn" title="باز در پنجره">⧉</button>
        <button id="open-options" class="icon ghost" data-i18n-title="settingsBtn" title="تنظیمات">⚙</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="tasks" role="tab" data-i18n="tabTasks">تسک‌ها</button>
      <button class="tab" data-tab="report" role="tab" data-i18n="tabReport">گزارش</button>
    </nav>

    <!-- ═══════════════════ TAB: تسک‌ها ═══════════════════ -->
    <div id="tab-tasks">

      <section class="card">
        <div id="active-list"></div>
      </section>

      <section class="card">
        <div id="task-list"></div>
        <div class="add-task-row row">
          <input type="text" id="new-task-input" class="grow"
                 data-i18n-ph="newTaskPlaceholder" placeholder="نام تسک جدید…" />
          <button id="add-task" class="primary" data-i18n="addTask">+ تسک</button>
        </div>
      </section>

    </div>

    <!-- ═══════════════════ TAB: گزارش ═══════════════════ -->
    <div id="tab-report" hidden>

      <section class="card filter-card">
        <button class="filter-toggle row between" id="filter-toggle" aria-expanded="false">
          <span data-i18n="filterTitle">فیلتر تاریخ</span>
          <span class="row" style="gap:0.4rem">
            <span id="range-summary" class="tag mono"></span>
            <span class="chevron">▼</span>
          </span>
        </button>
        <div class="filter-body" id="filter-body" hidden>
          <div class="row presets">
            <button data-preset="this-week" class="primary" data-i18n="thisWeek">این هفته</button>
            <button data-preset="last-week" class="ghost" data-i18n="lastWeek">هفته گذشته</button>
            <button data-preset="last-30" class="ghost" data-i18n="last30">۳۰ روز اخیر</button>
          </div>
          <div class="row custom">
            <label class="grow">
              <span data-i18n="fromLabel">از</span>
              <input type="date" id="from-date" />
            </label>
            <label class="grow">
              <span data-i18n="toLabel">تا</span>
              <input type="date" id="to-date" />
            </label>
            <button id="apply-range" class="primary" data-i18n="applyFilter">اعمال</button>
          </div>
        </div>
      </section>

      <!-- visual summary (charts) -->
      <section class="card summary-card" id="summary-section" hidden>
        <div class="summary-stats">
          <div class="stat-chip">
            <div class="stat-lbl" data-i18n="totalTime">مجموع</div>
            <div class="stat-val mono" id="summary-total">—</div>
          </div>
          <div class="stat-chip">
            <div class="stat-lbl" data-i18n="topTask">برترین</div>
            <div class="stat-val" id="summary-top">—</div>
          </div>
        </div>
        <div id="chart-bars-wrap" class="chart-bars-wrap"></div>
        <div class="summary-bottom">
          <div id="donut-wrap" class="donut-wrap"></div>
          <div id="proj-list-chart" class="proj-list-chart"></div>
        </div>
      </section>

      <section class="card">
        <div class="row between">
          <h2 data-i18n="reportTitle">گزارش</h2>
          <span id="grand-total" class="tag mono"></span>
        </div>
        <div id="report"></div>
      </section>

      <section class="card">
        <div class="row between">
          <h2 data-i18n="textOutput">خروجی متنی</h2>
          <div class="row">
            <button id="copy-text" class="icon ghost" data-i18n-title="copyBtn" title="کپی">⎘</button>
            <button id="download-text" class="icon ghost" data-i18n-title="downloadBtn" title="دانلود">↓</button>
            <button id="download-md" class="icon ghost" data-i18n-title="downloadMd" title="دانلود MD">MD</button>
          </div>
        </div>
        <textarea id="export-text" rows="8" readonly></textarea>
      </section>

    </div>

    <p id="error" class="error" hidden></p>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
